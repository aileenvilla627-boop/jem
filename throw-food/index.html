<title>Throw Food For Animals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: chunky Roblox-style toy UI — HUD strip, side-scrolling world canvas with throw meter under it, shop/pen/gym panel beside (stacks on phones). Single sunny-day theme by design. */
:root{
  --sky:#5bb8f0; --sky-deep:#2f86c9; --ink:#17283a; --ink-soft:#4b6178;
  --panel:#f3f8fc; --panel-2:#e2edf6; --line:#bcd2e4;
  --go:#2fbf5b; --go-dark:#1d8a3e; --sun:#ffc634; --sun-dark:#d89a00;
  --danger:#ef5a4f; --danger-dark:#b5372e;
  --common:#8a9bad; --rare:#3d8bfd; --legend:#f29b19;
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{background:var(--sky-deep)}
body{margin:0;background:var(--sky-deep) linear-gradient(180deg,var(--sky) 0%,var(--sky-deep) 900px) no-repeat;color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;color:#fff;letter-spacing:.5px;
  text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);text-wrap:balance}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.hud{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:5px 12px;font-family:var(--display);font-weight:600;font-size:16px;
  display:flex;gap:7px;align-items:baseline;box-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums}
.chip small{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.chip.coins b{color:#a26b00}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);overflow:hidden;min-width:0}
.view{position:relative;height:clamp(300px,52vw,500px);background:#bfe9ff}
.view canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.zonetag{position:absolute;left:12px;top:12px;background:rgba(23,40,58,.78);color:#fff;font-family:var(--display);font-weight:600;font-size:15px;padding:5px 12px;border-radius:10px;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:18px;color:var(--ink)}
.controls{display:flex;gap:12px;align-items:center;padding:12px;border-top:3px solid var(--ink);flex-wrap:wrap}
.meter{flex:1 1 260px;min-width:0}
.meter-label{display:flex;justify-content:space-between;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
.bar{position:relative;height:30px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;
  background:linear-gradient(90deg,#ef5a4f 0%,#f5a23a 45%,#ffd84a 75%,#7ad35a 92%,#2fbf5b 95%,#2fbf5b 100%)}
.ticks{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 2px;pointer-events:none}
.ticks i{width:2px;background:rgba(23,40,58,.25)}
.needle{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px;box-shadow:0 0 0 2px #fff}
.btn{font-family:var(--display);font-weight:700;font-size:18px;border:3px solid var(--ink);border-radius:14px;padding:10px 18px;cursor:pointer;color:#fff;
  background:var(--go);box-shadow:0 5px 0 var(--go-dark),0 5px 0 3px var(--ink);transition:transform .05s;letter-spacing:.3px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--go-dark),0 1px 0 3px var(--ink)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn[disabled]{background:#9db0c0;box-shadow:0 5px 0 #73879a,0 5px 0 3px var(--ink);cursor:not-allowed}
.btn.big{font-size:24px;padding:12px 30px;min-width:150px}
@media (max-width:520px){.controls .btn.big{flex:1 1 100%}}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-dark),0 5px 0 3px var(--ink)}
.btn.red{background:var(--danger);box-shadow:0 5px 0 var(--danger-dark),0 5px 0 3px var(--ink)}
.btn.sm{font-size:14px;padding:6px 12px;border-radius:10px;box-shadow:0 3px 0 var(--go-dark),0 3px 0 3px var(--ink)}
.btn.sm.sun{box-shadow:0 3px 0 var(--sun-dark),0 3px 0 3px var(--ink)}
.btn.sm.red{box-shadow:0 3px 0 var(--danger-dark),0 3px 0 3px var(--ink)}
.btn.sm[disabled]{box-shadow:0 3px 0 #73879a,0 3px 0 3px var(--ink)}
.side{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);min-width:0;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:3px solid var(--ink)}
.tab{font-family:var(--display);font-weight:600;font-size:16px;background:var(--panel-2);border:0;border-right:3px solid var(--ink);padding:10px 4px;cursor:pointer;color:var(--ink-soft)}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink)}
.tab:first-child{border-top-left-radius:15px}.tab:last-child{border-top-right-radius:15px}
.pane{padding:12px;display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto}
.sec{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
.item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.item.on{border-color:var(--go);background:#ecfbef}
.ico{font-size:28px;line-height:1;text-align:center}
.item b{font-family:var(--display);font-weight:600;font-size:16px;display:block}
.item span{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-weight:800;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 7px;color:#fff;margin-left:4px;vertical-align:2px}
.r0{background:var(--common)}.r1{background:var(--rare)}.r2{background:var(--legend)}
.gym{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 0}
.gym .stat{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.gym p{margin:0;color:var(--ink-soft);max-width:36ch}
.empty{color:var(--ink-soft);text-align:center;padding:18px 8px;background:#fff;border:2px dashed var(--line);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;
  padding:10px 18px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center;z-index:20}
.help{color:#eaf5ff;font-size:13px;text-align:center}
.help kbd{background:#fff;color:var(--ink);border-radius:5px;padding:0 6px;font-family:var(--body);font-weight:800;border-bottom:2px solid var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="top">
    <h1>Throw Food For Animals</h1>
    <div class="hud">
      <div class="chip coins"><small>Coins</small><b id="hudCoins">0</b></div>
      <div class="chip"><small>Income</small><span id="hudInc">0/s</span></div>
      <div class="chip"><small>Power</small><span id="hudPow">1.0</span></div>
      <div class="chip"><small>Pen</small><span id="hudPen">0/6</span></div>
      <div class="chip"><small>Best</small><span id="hudBest">0 m</span></div>
    </div>
  </div>

  <div class="main">
    <div class="stage">
      <div class="view" id="view" aria-label="3D game world: your pen, your avatar and 15 zones of animals"><div class="loading" id="loading">Loading 3D world…</div><div class="zonetag" id="zonetag">Your base</div></div>
      <div class="controls">
        <div class="meter">
          <div class="meter-label"><span>Throw meter</span><span id="meterVal">0 / 20</span></div>
          <div class="bar" id="bar"><div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="needle" id="needle"></div></div>
        </div>
        <button class="btn big" id="throwBtn">THROW</button>
      </div>
    </div>

    <div class="side">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-shop" aria-selected="true">Shop</button>
        <button class="tab" role="tab" id="tab-pen" aria-selected="false">Pen</button>
        <button class="tab" role="tab" id="tab-gym" aria-selected="false">Gym</button>
      </div>
      <div class="pane" id="pane"></div>
    </div>
  </div>
  <div class="help">Stop the needle near <b>20</b> for a PERFECT throw. <kbd>Space</kbd> throw · <kbd>T</kbd> pull-up · Train in the Gym to throw farther and reach rarer zones.</div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const ZONES=[
 ['Meadow','#79c95a','#bfe9ff',[['🐔','Chicken'],['🐰','Bunny'],['🦔','Hedgehog']]],
 ['Farm','#9ccc55','#c6ebff',[['🐷','Pig'],['🐄','Cow'],['🐴','Horse']]],
 ['Forest','#4c9a48','#b3def3',[['🦊','Fox'],['🦌','Deer'],['🦉','Owl']]],
 ['Lake','#5cb478','#a7dbf6',[['🦆','Duck'],['🐸','Frog'],['🦫','Beaver']]],
 ['Hills','#8dbf68','#bde1f1',[['🐐','Goat'],['🐏','Ram'],['🦙','Llama']]],
 ['Savanna','#d4b558','#ffe0a6',[['🦓','Zebra'],['🦒','Giraffe'],['🦁','Lion']]],
 ['Jungle','#2e8c4c','#a4e1c2',[['🐒','Monkey'],['🦜','Parrot'],['🐅','Tiger']]],
 ['Desert','#e6c473','#ffd79e',[['🦎','Lizard'],['🐪','Camel'],['🦂','Scorpion King']]],
 ['Swamp','#6d8c48','#c2d4ae',[['🐢','Turtle'],['🐊','Crocodile'],['🦩','Flamingo']]],
 ['Tundra','#e3eef4','#d4e6f4',[['🐧','Penguin'],['🦭','Seal'],['🐻‍❄️','Polar Bear']]],
 ['Peaks','#98a6b3','#c7d8ea',[['🦅','Eagle'],['🦬','Bison'],['🐆','Snow Leopard']]],
 ['Coast','#efd998','#a6e3ff',[['🦀','Crab'],['🐙','Octopus'],['🐬','Dolphin']]],
 ['Volcano','#5b3b3a','#f0a07a',[['🦕','Bronto'],['🦖','T-Rex'],['🐉','Fire Dragon']]],
 ['Candy Land','#f3a2c6','#ffd5eb',[['🐑','Cotton Sheep'],['🦄','Unicorn'],['🐲','Sugar Dragon']]],
 ['Moon','#b6b6c6','#2a2350',[['👾','Moon Critter'],['🦑','Space Squid'],['🌟','Star Beast']]],
];
const RAR=['Common','Rare','Legendary'];
const FOODS=[
 {n:'Bread',e:'🍞',cost:0,luck:1,range:1},
 {n:'Apple',e:'🍎',cost:200,luck:1.4,range:1.03},
 {n:'Carrot',e:'🥕',cost:2000,luck:1.9,range:1.06},
 {n:'Corn',e:'🌽',cost:15000,luck:2.6,range:1.1},
 {n:'Fish',e:'🐟',cost:120000,luck:3.5,range:1.14},
 {n:'Cake',e:'🍰',cost:1e6,luck:4.8,range:1.18},
 {n:'Honey Pot',e:'🍯',cost:8e6,luck:6.5,range:1.22},
 {n:'Watermelon',e:'🍉',cost:6e7,luck:9,range:1.28},
];
const BARS=[
 {n:'Wooden Bar',e:'🪵',cost:0,mult:1},
 {n:'Steel Bar',e:'🔩',cost:800,mult:2},
 {n:'Gold Bar',e:'🥇',cost:25000,mult:5},
 {n:'Diamond Bar',e:'💎',cost:9e5,mult:12},
 {n:'Cosmic Bar',e:'🌌',cost:3e7,mult:30},
];
const ZONE_M=100, WORLD_M=ZONE_M*ZONES.length, PLAYER_X=34, PEN_X0=3, PEN_X1=27;
const inc=(z,r)=>[1,5,25][r]*Math.pow(z+1,1.7);
const penCap=l=>6+3*l, penCost=l=>Math.round(150*Math.pow(2.3,l));
const fmt=n=>{n=Math.floor(n);if(n<1000)return String(n);const u=['K','M','B','T','Qa'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return (n<10?n.toFixed(2):n<100?n.toFixed(1):n.toFixed(0))+u[i]};

const fresh=()=>({coins:0,power:1,food:0,foodsOwned:[0],bar:0,barsOwned:[0],penLvl:0,pen:[],best:0,seen:{},saved:Date.now()});
let S=fresh();
function load(d){ if(d&&d.coins!=null){S=Object.assign(fresh(),d);return true} try{const j=localStorage.getItem('tffa-save');if(j){S=Object.assign(fresh(),JSON.parse(j));return true}}catch(e){} return false }
function save(){ S.saved=Date.now(); try{localStorage.setItem('tffa-save',JSON.stringify(S))}catch(e){} }
const income=()=>S.pen.reduce((a,p)=>a+inc(p.z,p.r),0);

/* ---------- DOM ---------- */
const $=id=>document.getElementById(id);
let toastT=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- 3D scene ---------- */
const view=$('view');
let renderer,scene,camera,sun,hemi,player,parts={},foodSprite,animalGroup,bestPole,penSprites=[],texCache={};
const camPos=new THREE.Vector3(), camLook=new THREE.Vector3();
const LANE_W=60, PEN={x0:14,x1:30,z0:-20,z1:-8};

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function emojiTex(e){if(texCache[e])return texCache[e];return texCache[e]=canvasTex(128,128,(g)=>{g.font=`104px ${EMOJI}`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,64,70)})}
function emojiSprite(e,size){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex(e),transparent:true}));s.scale.set(size,size,1);return s}
function textSprite(text,{bg='#ffffff',fg='#17283a',size=2,font='600 52px Fredoka, Nunito, sans-serif',border=true}={}){
  const tmp=document.createElement('canvas').getContext('2d');tmp.font=font;const tw=Math.ceil(tmp.measureText(text).width)+48;
  const tex=canvasTex(tw,84,(g,w,h)=>{g.font=font;if(bg){g.fillStyle=bg;g.strokeStyle='#17283a';g.lineWidth=border?8:0;const r=16;
    g.beginPath();g.moveTo(r,4);g.arcTo(w-4,4,w-4,h-4,r);g.arcTo(w-4,h-4,4,h-4,r);g.arcTo(4,h-4,4,4,r);g.arcTo(4,4,w-4,4,r);g.closePath();g.fill();if(border)g.stroke()}
    g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+3)});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:true}));s.scale.set(size*tw/84,size,1);return s}
function box(w,h,d,color,opts={}){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color,...opts}));m.castShadow=true;m.receiveShadow=true;return m}
function cyl(rt,rb,h,color,seg=8){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),new THREE.MeshLambertMaterial({color}));m.castShadow=true;m.receiveShadow=true;return m}
function cone(r,h,color,seg=8){const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),new THREE.MeshLambertMaterial({color}));m.castShadow=true;return m}
function at(m,x,y,z){m.position.set(x,y,z);return m}
function blob(r){const m=new THREE.Mesh(new THREE.CircleGeometry(r,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=.03;return m}

const studTex=canvasTex(64,64,(g)=>{g.fillStyle='#fff';g.fillRect(0,0,64,64);g.fillStyle='rgba(0,0,0,.07)';g.beginPath();g.arc(32,32,13,0,7);g.fill();g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(29,29,10,0,7);g.fill();g.strokeStyle='rgba(0,0,0,.05)';g.lineWidth=2;g.strokeRect(0,0,64,64)});
studTex.wrapS=studTex.wrapT=THREE.RepeatWrapping;

const DECO=['flower','wheat','pine','reed','tree','acacia','palm','cactus','reed','snowpine','rock','palm','lava','lolly','crater'];
function makeDeco(type,z){
  const g=new THREE.Group(), col=ZONES[z][1];
  if(type==='pine'||type==='snowpine'){g.add(at(cyl(.3,.4,1.6,0x7a5230),0,.8,0));
    [2.4,1.8,1.2].forEach((r,i)=>{const c=cone(r,2.4,type==='snowpine'?0xe9f3f8:0x2f7a3c);c.position.y=2.2+i*1.3;g.add(c)})}
  else if(type==='tree'||type==='acacia'){g.add(at(cyl(.35,.45,type==='acacia'?3.4:2.6,0x7a5230),0,type==='acacia'?1.7:1.3,0));
    const t=type==='acacia'?box(5,.9,5,0x6f8f2a):box(3,3,3,0x3f9b45);t.position.y=type==='acacia'?3.6:3.6;g.add(t)}
  else if(type==='palm'){const tr=cyl(.25,.4,5,0x9a6b3c);tr.position.y=2.5;tr.rotation.z=.12;g.add(tr);
    for(let i=0;i<5;i++){const l=box(3.2,.15,.8,0x2e9b4c);l.position.set(Math.cos(i*1.26)*1.3+.3,5,Math.sin(i*1.26)*1.3);l.rotation.y=-i*1.26;l.rotation.z=-.35;g.add(l)}}
  else if(type==='cactus'){const b=box(.9,3.6,.9,0x3f8f4a);b.position.y=1.8;g.add(b);const a1=box(.6,1.4,.6,0x3f8f4a);a1.position.set(.8,2.2,0);g.add(a1);const a2=box(.6,1.2,.6,0x3f8f4a);a2.position.set(-.8,1.6,0);g.add(a2)}
  else if(type==='rock'||type==='lava'||type==='crater'){const r=box(2.2,1.4,1.8,type==='lava'?0x3a2a2a:type==='crater'?0x8f8fa3:0x8a8f96);r.position.y=.7;r.rotation.y=Math.random()*3;g.add(r);
    if(type==='lava'){const l=box(1.2,.2,1,0xff6a1a,{emissive:0xff4a00});l.position.set(1.4,.1,.6);g.add(l)}}
  else if(type==='lolly'){g.add(at(cyl(.12,.12,3,0xffffff),0,1.5,0));const c=cyl(1.1,1.1,.3,[0xff6fb0,0x7fd3ff,0xffd84a][Math.floor(Math.random()*3)],20);c.rotation.x=Math.PI/2;c.position.y=3.4;g.add(c)}
  else if(type==='wheat'){for(let i=0;i<5;i++){const w=box(.12,1.4,.12,0xe2c35a);w.position.set((i-2)*.25,.7,Math.random()*.4);g.add(w)}}
  else if(type==='reed'){for(let i=0;i<4;i++){const w=box(.15,1.8,.15,0x5f8f3a);w.position.set((i-1.5)*.3,.9,0);g.add(w);const t=box(.25,.6,.25,0x7a5230);t.position.set((i-1.5)*.3,1.9,0);g.add(t)}}
  else {/*flower*/const st=box(.1,.8,.1,0x3f9b45);st.position.y=.4;g.add(st);const f=box(.5,.5,.5,[0xffd84a,0xff7aa8,0xffffff][Math.floor(Math.random()*3)]);f.position.y=.9;g.add(f)}
  return g;
}

function buildAvatar(){
  const g=new THREE.Group(), yellow=0xffcf3a;
  const face=canvasTex(64,64,(c)=>{c.fillStyle='#ffcf3a';c.fillRect(0,0,64,64);c.fillStyle='#17283a';c.fillRect(18,22,6,9);c.fillRect(40,22,6,9);c.lineWidth=4;c.strokeStyle='#17283a';c.beginPath();c.arc(32,38,10,.15*Math.PI,.85*Math.PI);c.stroke()});
  const headMats=[0,1,2,3,4,5].map(i=>new THREE.MeshLambertMaterial(i===0?{map:face}:{color:yellow}));
  const head=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),headMats);head.position.y=4.3;head.castShadow=true;
  const torso=box(2,2,1,0x3d8bfd);torso.position.y=2.9;

function homeCam(snap){const p=new THREE.Vector3(PLAYER_X-17,11,15),l=new THREE.Vector3(PLAYER_X+12,1,-5);if(snap){camPos.copy(p);camLook.copy(l)}return {p,l}}
function resize(){if(!renderer)return;const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<520?66:55;camera.updateProjectionMatrix()}

function syncPen(){

  const shown=S.pen.slice(-24);
  while(penSprites.length>shown.length){const s=penSprites.pop();scene.remove(s.g)}
  shown.forEach((a,i)=>{
    let s=penSprites[i];const e=ZONES[a.z][3][a.r][0];
    if(!s||s.key!==e){if(s)scene.remove(s.g);const g=new THREE.Group();const sp=emojiSprite(e,1.6+a.r*.5);sp.position.y=.8+a.r*.25;g.add(sp,blob(.7));
      g.position.set(PEN.x0+1.5+Math.random()*(PEN.x1-PEN.x0-3),0,PEN.z0+1.5+Math.random()*(PEN.z1-PEN.z0-3));scene.add(g);
      s=penSprites[i]={g,key:e,sp,tx:g.position.x,tz:g.position.z,ph:Math.random()*6}}
  });

/* ---------- game state machine ---------- */
let phase='idle', meterT=0, meterV=0, throwData=null, liftT=0, throwAnim=0, ret=null, popups=[];
function doThrow(){
  if(phase!=='idle')return;
  const v=meterV, perfect=v>=19, great=v>=15;
  const f=FOODS[S.food];
  let d=(v/20)*S.power*ZONE_M*f.range*(perfect?1.15:1);
  d=Math.max(PLAYER_X+4,Math.min(WORLD_M-2,PLAYER_X+d));
  const dist=d-PLAYER_X, T=1.0+Math.min(2.2,dist/300);
  throwData={d,dist,t:0,T,v,perfect,great,food:f,lz:(Math.random()-.5)*4,animal:null};
  foodSprite.material.map=emojiTex(f.e);foodSprite.visible=true;parts.held.visible=false;
  phase='flying';throwAnim=.35;
  addPopup(perfect?'PERFECT!':great?'GREAT!':v.toFixed(1)+' / 20',perfect?'#2fbf5b':great?'#ffc634':'#ffffff',new THREE.Vector3(PLAYER_X,7,0));
  $('throwBtn').disabled=true;
}
function addPopup(text,color,pos){const s=textSprite(text,{size:1.6,bg:color,fg:color==='#ffffff'||color==='#ffc634'?'#17283a':'#fff'});s.position.copy(pos);scene.add(s);popups.push({s,t:0})}
function rollAnimal(z,luck){
  const w=[70,25*luck,5*Math.pow(luck,1.5)], tot=w[0]+w[1]+w[2];
  let x=Math.random()*tot, r=0; if(x>w[0]){r=1; if(x>w[0]+w[1]) r=2}
  return {z,r,e:ZONES[z][3][r][0],n:ZONES[z][3][r][1]};
}
function land(){
  const td=throwData, z=Math.min(ZONES.length-1,Math.floor(td.d/ZONE_M));
  if(td.d>S.best)S.best=td.d;
  const a=rollAnimal(z,td.food.luck*(td.perfect?1.25:1));
  td.animal={...a,x:td.d+28,side:td.lz+(Math.random()-.5)*10,tx:td.d+1.6};
  animalGroup.clear();const sp=emojiSprite(a.e,2.4+a.r*.9);sp.position.y=1.2+a.r*.45;animalGroup.add(sp,blob(1+a.r*.3));
  if(a.r>0){const tag=textSprite(RAR[a.r].toUpperCase(),{size:1,bg:a.r===2?'#f29b19':'#3d8bfd',fg:'#fff'});tag.position.y=3.4+a.r*.8;animalGroup.add(tag)}
  animalGroup.position.set(td.animal.x,0,td.animal.side);animalGroup.visible=true;
  foodSprite.position.set(td.d,.8,td.lz);
  td.zone=z;phase='approach';
}
function catchIt(){
  const a=throwData.animal;
  const key=a.z+'-'+a.r, isNew=!S.seen[key]; S.seen[key]=1;
  const pos=new THREE.Vector3(throwData.d,5,throwData.lz);
  if(S.pen.length>=penCap(S.penLvl)){
    addPopup('Pen full!','#ef5a4f',pos);
    toast(`${a.n} wandered off. Your pen is full: sell animals or upgrade the pen.`);
  }else{
    S.pen.push({z:a.z,r:a.r,id:Date.now()+Math.random()});
    addPopup(`+ ${a.n}`,['#ffffff','#3d8bfd','#f29b19'][a.r],pos);
    toast(`${isNew?'New! ':''}Caught a ${RAR[a.r]} ${a.n} from the ${ZONES[a.z][0]} (+${fmt(inc(a.z,a.r))}/s)`);
  }
  foodSprite.visible=false;animalGroup.visible=false;
  const h=homeCam(false);ret={t:0,T:Math.min(2,.8+throwData.dist/900),p0:camPos.clone(),l0:camLook.clone(),p1:h.p,l1:h.l};
  phase='return';save();syncPen();render();
}

/* ---------- loop ---------- */
let last=performance.now(), saveAcc=0, uiAcc=0, clock=0;
const tmpP=new THREE.Vector3(),tmpL=new THREE.Vector3();
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  S.coins+=income()*dt; saveAcc+=dt; uiAcc+=dt;
  if(liftT>0)liftT-=dt; if(throwAnim>0)throwAnim-=dt;
  const td=throwData;
  if(phase==='idle'){meterT+=dt;const c=(meterT%1.5)/1.5;meterV=20*(c<.5?c*2:2-c*2);const h=homeCam(false);tmpP.copy(h.p);tmpL.copy(h.l)}
  else if(phase==='flying'){
    td.t+=dt;const s=Math.min(1,td.t/td.T), hM=Math.min(34,5+td.dist*.16);
    const x=PLAYER_X+.8+(td.d-PLAYER_X-.8)*s, y=4.6*(1-s)+.8*s+4*hM*s*(1-s), z=td.lz*s;
    foodSprite.position.set(x,y,z);foodSprite.material.rotation=td.t*10;
    tmpP.set(x-16,Math.max(8,y*.6+6),z+13);tmpL.set(x+6,y*.5,z);
    if(s>=1)land();
  }else if(phase==='approach'){
    const a=td.animal;a.x-=dt*(16+a.r*4);const k=Math.min(1,(a.x-a.tx)/26);
    animalGroup.position.set(Math.max(a.tx,a.x),Math.abs(Math.sin(clock*14))*.6,td.lz+(a.side-td.lz)*k);
    tmpP.set(td.d-12,7,td.lz+12);tmpL.set(td.d+4,1,td.lz);
    if(a.x<=a.tx){phase='eat';td.eatT=0}
  }else if(phase==='eat'){
    td.eatT+=dt;animalGroup.position.y=Math.abs(Math.sin(clock*20))*.25;foodSprite.scale.setScalar(1.6*Math.max(.1,1-td.eatT/.8));
    tmpP.set(td.d-12,7,td.lz+12);tmpL.set(td.d+4,1,td.lz);
    if(td.eatT>.9){foodSprite.scale.setScalar(1.6);catchIt()}
  }else if(phase==='return'){
    ret.t+=dt;const e=ease(Math.min(1,ret.t/ret.T));tmpP.lerpVectors(ret.p0,ret.p1,e);tmpL.lerpVectors(ret.l0,ret.l1,e);
    if(ret.t>=ret.T){phase='idle';throwData=null;parts.held.visible=true;$('throwBtn').disabled=false}
  }
  if(phase==='return'){camPos.copy(tmpP);camLook.copy(tmpL)}
  else{const k=Math.min(1,dt*(phase==='flying'?9:5));camPos.lerp(tmpP,k);camLook.lerp(tmpL,k)}
  camera.position.copy(camPos);camera.lookAt(camLook);
  // sun & shadows follow the action
  sun.position.set(camLook.x-20,40,camLook.z+25);sun.target.position.copy(camLook);
  // sky/fog by zone
  const zi=Math.max(0,Math.min(ZONES.length-1,Math.floor(camLook.x/ZONE_M)));
  const sky=new THREE.Color(ZONES[zi][2]);scene.background.lerp(sky,Math.min(1,dt*3));scene.fog.color.copy(scene.background);
  $('zonetag').textContent=phase==='idle'||camLook.x<ZONE_M*.05+PLAYER_X?'Your base':`Zone ${zi+1}: ${ZONES[zi][0]}`;
  // avatar animation
  const swing=throwAnim>0?-2.6*Math.sin((1-throwAnim/.35)*Math.PI):0;
  parts.armR.rotation.z=liftT>0?2.9:swing||Math.sin(clock*2)*.05;
  parts.armL.rotation.z=liftT>0?2.9:-Math.sin(clock*2)*.05;
  player.position.y=liftT>0?.8:0;
  if(parts.held.visible)parts.held.material.map=emojiTex(FOODS[S.food].e);
  // pen animals wander
  penSprites.forEach((s,i)=>{const p=s.g.position;if(Math.hypot(s.tx-p.x,s.tz-p.z)<.3||Math.random()<.002){s.tx=PEN.x0+1.5+Math.random()*(PEN.x1-PEN.x0-3);s.tz=PEN.z0+1.5+Math.random()*(PEN.z1-PEN.z0-3)}
    const dx=s.tx-p.x,dz=s.tz-p.z,L=Math.hypot(dx,dz)||1;p.x+=dx/L*dt*1.4;p.z+=dz/L*dt*1.4;s.sp.position.y=.8+Math.abs(Math.sin(clock*6+s.ph))*.25;s.sp.material.rotation=0});
  bestPole.visible=S.best>PLAYER_X+1;bestPole.position.set(S.best,0,-4);
  popups.forEach(u=>{u.t+=dt;u.s.position.y+=dt*2.5;u.s.material.opacity=Math.max(0,1-u.t/1.6)});
  popups=popups.filter(u=>{if(u.t>=1.6){scene.remove(u.s);return false}return true});
  renderer.render(scene,camera);
  $('needle').style.left=(meterV/20*100)+'%';$('meterVal').textContent=meterV.toFixed(1)+' / 20';
  if(uiAcc>.2){uiAcc=0;hud();if(tab==='shop'||tab==='gym')refreshButtons()}
  if(saveAcc>5){saveAcc=0;save()}
  requestAnimationFrame(frame);
}
function hud(){
  $('hudCoins').textContent=fmt(S.coins);$('hudInc').textContent=fmt(income())+'/s';
  $('hudPow').textContent=S.power.toFixed(1);$('hudPen').textContent=`${S.pen.length}/${penCap(S.penLvl)}`;$('hudBest').textContent=Math.max(0,Math.floor(S.best-PLAYER_X))+' m';
}

/* ---------- panels ---------- */

    h+=`<div class="gym"><div class="ico" style="font-size:54px">${BARS[S.bar].e}</div><div class="sec">Throw power</div><div class="stat" id="gymPow">${S.power.toFixed(2)}</div>

function refreshButtons(){document.querySelectorAll('[data-cost]').forEach(b=>b.disabled=S.coins<+b.dataset.cost);const gp=$('gymPow');if(gp)gp.textContent=S.power.toFixed(2)}
function pullUp(){S.power+=0.05*BARS[S.bar].mult;liftT=.25;const gp=$('gymPow');if(gp)gp.textContent=S.power.toFixed(2);hud()}
$('pane').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(b.id==='pullBtn'){pullUp();return}
  if(d.buyfood){const f=FOODS[+d.buyfood];if(S.coins>=f.cost){S.coins-=f.cost;S.foodsOwned.push(+d.buyfood);S.food=+d.buyfood;toast(`Bought ${f.n}!`)}}
  else if(d.equip){S.food=+d.equip}
  else if(d.pen){const c=penCost(S.penLvl);if(S.coins>=c){S.coins-=c;S.penLvl++;toast(`Pen holds ${penCap(S.penLvl)} animals now`)}}
  else if(d.buybar){const x=BARS[+d.buybar];if(S.coins>=x.cost){S.coins-=x.cost;S.barsOwned.push(+d.buybar);S.bar=+d.buybar;toast(`Training with the ${x.n}`)}}
  else if(d.bar){S.bar=+d.bar}
  else if(d.sell){const i=S.pen.findIndex(a=>String(a.id)===d.sell);if(i>=0){const a=S.pen[i];S.coins+=inc(a.z,a.r)*15;S.pen.splice(i,1)}}
  else if(d.sellcommon){let g=0;S.pen=S.pen.filter(a=>{if(a.r===0){g+=inc(a.z,a.r)*15;return false}return true});if(g)toast(`Sold Commons for ${fmt(g)} coins`)}
  save();hud();render();syncPen();
});
$('throwBtn').onclick=doThrow;
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.code==='Space'){e.preventDefault();doThrow()}
  else if(e.key==='t'||e.key==='T'){pullUp()}
});

/* ---------- boot ---------- */
function start(data){
  const had=load(data&&data.S);
  if(had){const away=Math.min(7200,(Date.now()-S.saved)/1000);const earned=income()*away*.5;
    if(away>60&&earned>0){S.coins+=earned;setTimeout(()=>toast(`Welcome back! Your pen earned ${fmt(earned)} coins while you were away`),400)}}
  else{setTimeout(()=>toast('Stop the needle near 20 and press THROW!'),500)}
  init3D();resize();syncPen();hud();render();requestAnimationFrame(t=>{last=t;frame(t)});
}
window.addEventListener('beforeunload',save);
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
